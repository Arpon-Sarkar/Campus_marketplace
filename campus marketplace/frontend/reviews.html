<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews | Campus Marketplace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span>Campus</span> Marketplace
    </div>

    
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="services.html">Services</a>
      <a href="orders.html">My Orders</a>
      <a href="seller-orders.html">Seller Orders</a>
      <a href="booking.html">Bookings</a>
      <a href="reviews.html">Reviews</a>
      <a href="notifications.html">Notifications</a>
      <a href="profile.html">Profile</a>
      <a href="add-product.html" class="nav-btn">Add Product</a>
      <a href="add-service.html" class="nav-btn">Add Service</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <section class="page-header">
    <h1>Reviews & Ratings</h1>
    <p>Share your experience and help build trust inside the campus marketplace.</p>
  </section>

  <section class="auth-section">
    <div class="auth-card">
      <h2>Give a Review</h2>

      <form id="reviewForm">
        <div class="form-group">
          <label for="rating">Rating</label>
          <select id="rating" required>
            <option value="">Select rating</option>
            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
            <option value="4">⭐⭐⭐⭐ Good</option>
            <option value="3">⭐⭐⭐ Average</option>
            <option value="2">⭐⭐ Poor</option>
            <option value="1">⭐ Very Poor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reviewComment">Comment</label>
          <textarea 
            id="reviewComment" 
            placeholder="Write your feedback..."
            required
          ></textarea>
        </div>

        <button type="submit" class="primary-btn full-btn">
          Submit Review
        </button>
      </form>
    </div>
  </section>

  <section class="page-header small-header">
    <h2>All Reviews</h2>
  </section>

  <section class="card-grid" id="reviewList">
    <p>Loading reviews...</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
